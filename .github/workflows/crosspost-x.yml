# Federates every newly added note and post to X as @thoughtwax_bot.
# Notes go out as their full text (a thread if X refuses a long post),
# posts as "Title <link>". Only files added in a
# push are considered, so edits and old posts are never reposted. To keep one
# off X, add `crosspost: no` to its front matter (or untick "Post to X" in /post/).
#
# One-time setup, in the repository's Settings > Secrets and variables > Actions,
# add these four secrets from the bot account's X developer app (User
# authentication: OAuth 1.0a, Read and write; then regenerate the Access Token
# and Secret). Until they exist the workflow logs what it would post and stops.
#   X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET
name: Federate notes and posts to X

on:
  push:
    branches: [master]
    paths: ['_posts/**']
  # Manual run (Actions tab > Run workflow): repost given files, optionally
  # deleting earlier X posts first. Skips the age check.
  workflow_dispatch:
    inputs:
      files:
        description: 'Post files to (re)post, space separated, e.g. _posts/2026-11-04-1829.markdown'
        required: false
      delete_ids:
        description: 'X post ids to delete first, space separated'
        required: false

permissions:
  contents: read

concurrency:
  group: crosspost-x
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find notes and posts added in this push
        id: added
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_FILES: ${{ inputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=$MANUAL_FILES" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- '_posts/*.markdown' '_posts/*.md' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.added.outputs.files != '' || inputs.delete_ids != ''
        with:
          node-version: 22

      - name: Post to X
        if: steps.added.outputs.files != '' || inputs.delete_ids != ''
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FILES: ${{ steps.added.outputs.files }}
          DELETE_IDS: ${{ inputs.delete_ids }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node .github/scripts/crosspost-x.mjs $FILES
