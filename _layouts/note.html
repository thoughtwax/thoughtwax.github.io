---
layout: default
---
<div id="post">
  <div class="note h-entry">
    <a class="hash u-url" href="{{ page.url }}" aria-label="Permalink to this note">#</a>
    <div class="e-content">
      {{ content }}
      {% include note-images.html images=page.images %}
    </div>
  </div>
</div>

<p class="meta note-date">— <time datetime="{{ page.date | date: "%Y-%m-%dT%H:%M:%S%:z" }}">{{ page.date | date_to_string }}</time></p>
