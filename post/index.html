<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New note — thoughtwax</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Note">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f6f2;
      --ink: #333;
      --soft: #8f8d87;
      --rule: #dedbd3;
      --field: #fffefb;
      --accent: #930909;
      --ok: #2f6b3a;
      --bad: #a3271b;
      --mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1c1b19;
        --ink: #e8e6e1;
        --soft: #9a978f;
        --rule: #3a3833;
        --field: #24231f;
        --accent: #e0645a;
        --ok: #7cc48a;
        --bad: #f08a7e;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body {
      font: 16px/1.5 var(--mono);
      -webkit-text-size-adjust: 100%;
      padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    main { max-width: 640px; margin: 0 auto; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 0 12px;
    }
    header h1 { font: 600 13px/1 var(--mono); letter-spacing: 0.2em; text-transform: uppercase; margin: 0; }
    header h1 span:first-child { color: var(--accent); }
    button { font: inherit; color: inherit; cursor: pointer; }
    .icon-btn {
      background: none; border: 0; padding: 8px; margin: -8px; color: var(--soft);
      font-size: 13px; text-decoration: underline; text-underline-offset: 3px;
    }

    .toolbar {
      display: flex; gap: 6px; padding: 8px 0; position: sticky; top: 0; background: var(--paper); z-index: 2;
    }
    .toolbar button {
      min-width: 44px; height: 40px; padding: 0 10px;
      background: var(--field); border: 1px solid var(--rule); border-radius: 8px;
      font-size: 15px;
    }
    .toolbar button[aria-pressed="true"] { border-color: var(--ink); background: var(--rule); }
    .toolbar .b { font-weight: 600; }
    .toolbar .i { font-style: italic; }

    #editor {
      min-height: 38vh; padding: 14px; outline: none;
      background: var(--field); border: 1px solid var(--rule); border-radius: 10px;
      font-size: 16px; line-height: 1.55; overflow-wrap: anywhere;
    }
    #editor:focus { border-color: var(--soft); }
    #editor:empty::before { content: attr(data-placeholder); color: var(--soft); }
    #editor p, #editor div { margin: 0 0 0.8em; }
    #editor p:last-child, #editor div:last-child { margin-bottom: 0; }
    #editor ul, #editor ol { margin: 0 0 0.8em; padding-left: 1.4em; }
    #editor a { color: inherit; text-decoration: underline; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0; }
    label.check { display: flex; align-items: center; gap: 10px; font-size: 15px; padding: 6px 0; }
    label.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--ink); }
    .count { font-size: 13px; color: var(--soft); }
    .count.over { color: var(--bad); }

    .publish {
      width: 100%; height: 52px; border: 0; border-radius: 10px;
      background: var(--ink); color: var(--paper); font-weight: 600; font-size: 16px; letter-spacing: 0.02em;
    }
    .publish:disabled { opacity: 0.4; cursor: default; }

    .status { font-size: 14px; margin: 14px 0; min-height: 1.5em; color: var(--soft); }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    .status a { color: inherit; }

    .settings {
      border: 1px solid var(--rule); border-radius: 10px; padding: 14px; margin: 8px 0 16px; background: var(--field);
    }
    .settings[hidden] { display: none; }
    .settings h2 { font: 600 14px/1.4 var(--mono); margin: 0 0 8px; }
    .settings p { font-size: 13px; color: var(--soft); margin: 0 0 12px; }
    .settings p a { color: inherit; }
    .settings label { display: block; font-size: 13px; margin: 12px 0 4px; }
    .settings input[type=text], .settings input[type=password] {
      width: 100%; height: 44px; padding: 0 10px; font: 16px var(--mono); color: var(--ink);
      background: var(--paper); border: 1px solid var(--rule); border-radius: 8px;
    }
    .settings .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .settings .actions button {
      height: 42px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper);
    }
    .settings .actions .primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    .nav { display: flex; gap: 20px; }
    .panel {
      border: 1px solid var(--rule); border-radius: 10px; padding: 14px; margin: 8px 0 16px; background: var(--field);
    }
    .panel[hidden] { display: none; }
    .panel h2 { font: 600 14px/1.4 var(--mono); margin: 0 0 8px; }
    .note-list { list-style: none; margin: 0; padding: 0; }
    .note-list li + li { border-top: 1px solid var(--rule); }
    .note-list button {
      display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px 0;
    }
    .note-list .when { display: block; font-size: 12px; color: var(--soft); margin-bottom: 2px; }
    .note-list .snip { display: block; font-size: 14px; line-height: 1.45; }
    .more {
      width: 100%; height: 42px; margin-top: 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper);
    }
    .more[hidden] { display: none; }
    .editbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      font-size: 13px; color: var(--soft); padding: 4px 0;
    }
    .editbar[hidden] { display: none; }
    .row[hidden] { display: none; }
    .row[hidden] + .publish { margin-top: 16px; }
    .editbar a { color: inherit; }

    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 10px 0 0; padding: 0; list-style: none; }
    .photos:empty { display: none; }
    .photos li { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--rule); }
    .photos img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .photos li.busy img { opacity: .4; }
    .photos button {
      position: absolute; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 1;
      height: 26px; border-radius: 13px; padding: 0 9px;
    }
    .photos .remove { top: 5px; right: 5px; width: 26px; padding: 0; font-size: 16px; }
    .photos .alt { left: 5px; bottom: 5px; }
    .photos .alt.set { background: rgba(0,0,0,.8); }
    .toolbar label.add { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 40px; padding: 0 10px;
      background: var(--field); border: 1px solid var(--rule); border-radius: 8px; font-size: 15px; cursor: pointer; margin-left: auto; }
    .toolbar label.add[hidden] { display: none; }
    .toolbar label.add input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
<main>
  <header>
    <h1><span>#</span> <span id="title">New note</span></h1>
    <div class="nav">
      <button class="icon-btn" id="notes-toggle" type="button">Edit notes</button>
      <button class="icon-btn" id="settings-toggle" type="button">Settings</button>
    </div>
  </header>

  <section class="settings" id="settings" hidden>
    <h2>Connect to GitHub</h2>
    <p>Notes are saved straight into the blog's repository. Paste a
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a>
      that can only reach <b>thoughtwax.github.io</b>, with <b>Contents: Read and write</b>.
      It stays on this device and is only ever sent to GitHub.</p>
    <label for="token">Token</label>
    <input type="password" id="token" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
    <label for="repo">Repository</label>
    <input type="text" id="repo" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="branch">Branch</label>
    <input type="text" id="branch" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="actions">
      <button type="button" class="primary" id="save-settings">Save</button>
      <button type="button" id="forget-token">Forget token</button>
    </div>
    <div class="status" id="settings-status"></div>
  </section>

  <section class="panel" id="notes" hidden>
    <h2>Recent notes</h2>
    <ul class="note-list" id="note-list"></ul>
    <button type="button" class="more" id="more" hidden>Show more</button>
    <div class="status" id="notes-status"></div>
  </section>

  <div class="editbar" id="editbar" hidden>
    <span id="editing-label"></span>
    <button class="icon-btn" id="cancel-edit" type="button">Cancel</button>
  </div>

  <div class="toolbar" role="toolbar" aria-label="Formatting">
    <button type="button" class="b" data-cmd="bold" aria-label="Bold" aria-pressed="false">B</button>
    <button type="button" class="i" data-cmd="italic" aria-label="Italic" aria-pressed="false">I</button>
    <button type="button" data-cmd="link" aria-label="Link">Link</button>
    <button type="button" data-cmd="insertUnorderedList" aria-label="Bulleted list" aria-pressed="false">• List</button>
    <label class="add" id="add-photos">+ Photo<input type="file" id="photo-input" accept="image/*" multiple></label>
  </div>

  <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note text"
       data-placeholder="What's on your mind?" autocapitalize="sentences"></div>
  <ul class="photos" id="photos" aria-label="Photos"></ul>

  <div class="row" id="crosspost-row">
    <label class="check"><input type="checkbox" id="crosspost" checked> <span id="crosspost-label">Post to X</span></label>
    <span class="count" id="count" hidden></span>
  </div>

  <button class="publish" id="publish" type="button" disabled>Publish</button>
  <div class="status" id="status" aria-live="polite"></div>
</main>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var editor = $('editor');
  var publishBtn = $('publish');
  var statusEl = $('status');
  var crosspost = $('crosspost');
  var countEl = $('count');

  // ---- storage (wrapped: private mode can throw) -------------------------
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var K = { token: 'tw.token', repo: 'tw.repo', branch: 'tw.branch', draft: 'tw.draft' };
  var DEFAULT_REPO = 'thoughtwax/thoughtwax.github.io';
  var DEFAULT_BRANCH = 'master';
  var SITE = 'https://thoughtwax.com';

  function cfg() {
    return {
      token: store.get(K.token, ''),
      repo: store.get(K.repo, DEFAULT_REPO) || DEFAULT_REPO,
      branch: store.get(K.branch, DEFAULT_BRANCH) || DEFAULT_BRANCH
    };
  }

  // ---- editor ------------------------------------------------------------
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}

  var editing = null; // the note being edited: { path, sha, front, body, url }
  editor.innerHTML = store.get(K.draft, '');

  function isEmpty() { return editor.textContent.replace(/\s+/g, '') === ''; }
  // A note can be just photos, with no text.
  function hasPhotos() { return photos.length > 0 || !!(editing && /^images:/m.test(editing.front)); }
  function canPublish() { return (!isEmpty() || hasPhotos()) && !photos.some(function (p) { return !p.full; }); }

  function onChange() {
    if (isEmpty() && editor.innerHTML !== '') {
      // keep :empty placeholder working once everything is deleted
      if (!editor.querySelector('li, img')) editor.innerHTML = '';
    }
    if (!editing) store.set(K.draft, editor.innerHTML);
    publishBtn.disabled = !canPublish();
    updateCount();
    updateToolbarState();
  }
  editor.addEventListener('input', onChange);

  // Paste as plain text so formatting from other apps never sneaks in.
  editor.addEventListener('paste', function (e) {
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (text == null) return;
    e.preventDefault();
    document.execCommand('insertText', false, text);
  });

  var savedRange = null;
  function saveSelection() {
    var sel = window.getSelection();
    if (sel.rangeCount && editor.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0).cloneRange();
  }
  function restoreSelection() {
    if (!savedRange) return;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }
  document.addEventListener('selectionchange', function () {
    saveSelection();
    updateToolbarState();
  });

  function updateToolbarState() {
    ['bold', 'italic', 'insertUnorderedList'].forEach(function (cmd) {
      var btn = document.querySelector('[data-cmd="' + cmd + '"]');
      var on = false;
      try { on = document.queryCommandState(cmd); } catch (e) {}
      btn.setAttribute('aria-pressed', on && editor.contains(document.activeElement) ? 'true' : 'false');
    });
  }

  document.querySelectorAll('.toolbar button').forEach(function (btn) {
    // Keep the editor's focus and selection when a button is tapped.
    btn.addEventListener('pointerdown', function (e) { e.preventDefault(); });
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
    btn.addEventListener('click', function () {
      var cmd = btn.getAttribute('data-cmd');
      editor.focus();
      restoreSelection();
      if (cmd === 'link') return makeLink();
      document.execCommand(cmd, false, null);
      onChange();
    });
  });

  function makeLink() {
    var sel = window.getSelection();
    var anchor = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
    var existing = anchor && anchor.closest ? anchor.closest('#editor a') : null;
    var range = savedRange;
    var url = window.prompt('Link to', existing ? existing.getAttribute('href') : 'https://');
    editor.focus();
    if (range) { sel.removeAllRanges(); sel.addRange(range); }
    if (url === null) return;
    url = url.trim();
    if (url === '' || url === 'https://') {
      if (existing) { selectNode(existing); document.execCommand('unlink'); }
      return onChange();
    }
    if (!/^[a-z][a-z0-9+.-]*:/i.test(url) && !/^\//.test(url)) url = 'https://' + url;
    if (existing) {
      existing.setAttribute('href', url);
    } else if (sel.isCollapsed) {
      document.execCommand('insertHTML', false, '<a href="' + escapeAttr(url) + '">' + escapeHtml(url) + '</a>&nbsp;');
    } else {
      document.execCommand('createLink', false, url);
    }
    onChange();
  }
  function selectNode(n) {
    var r = document.createRange(); r.selectNodeContents(n);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

  // ---- HTML -> Markdown ----------------------------------------------------
  // Handles exactly what the toolbar can make: paragraphs, line breaks,
  // bold, italic, links and bulleted/numbered lists.
  function escapeMd(text) {
    return text.replace(/ /g, ' ').replace(/([\\`*_\[\]<])/g, '\\$1');
  }
  function inline(node) {
    var out = '';
    node.childNodes.forEach(function (c) {
      if (c.nodeType === 3) { out += escapeMd(c.nodeValue); return; }
      if (c.nodeType !== 1) return;
      var tag = c.tagName.toLowerCase();
      var inner = inline(c);
      if (tag === 'br') { out += '  \n'; return; }
      if (!inner.trim()) { out += inner; return; }
      // keep whitespace outside the markers, or Markdown won't recognise them
      var m = inner.match(/^(\s*)([\s\S]*?)(\s*)$/);
      var wrap = function (a, b) { return m[1] + a + m[2] + b + m[3]; };
      var w = (c.style && c.style.fontWeight) || '';
      if (tag === 'b' || tag === 'strong' || w === 'bold' || parseInt(w, 10) >= 600) out += wrap('**', '**');
      else if (tag === 'i' || tag === 'em' || (c.style && c.style.fontStyle === 'italic')) out += wrap('*', '*');
      else if (tag === 'a' && c.getAttribute('href')) out += wrap('[', '](' + c.getAttribute('href').replace(/[()\s]/g, function (ch) { return '%' + ch.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0'); }) + ')');
      else out += inner;
    });
    return out;
  }
  function blockStart(text) {
    // a paragraph that happens to start like Markdown syntax stays plain text
    return text.replace(/^(\s*)([#>+\-=])/, '$1\\$2').replace(/^(\s*\d+)\./, '$1\\.');
  }
  function toMarkdown(root) {
    var blocks = [];
    var loose = document.createElement('p');
    function flushLoose() {
      var t = inline(loose).replace(/^\s+|\s+$/g, '');
      if (t) blocks.push(blockStart(t));
      loose = document.createElement('p');
    }
    var BLOCK = /^(p|div|blockquote|h\d|ul|ol)$/;
    function walk(container) {
      container.childNodes.forEach(function (c) {
        var tag = c.nodeType === 1 ? c.tagName.toLowerCase() : '';
        if (tag === 'ul' || tag === 'ol') {
          flushLoose();
          var items = [];
          c.querySelectorAll(':scope > li').forEach(function (li, i) {
            var t = inline(li).replace(/^\s+|\s+$/g, '').replace(/ {2}\n/g, ' ');
            if (t) items.push((tag === 'ol' ? (i + 1) + '. ' : '- ') + t);
          });
          if (items.length) blocks.push(items.join('\n'));
        } else if (BLOCK.test(tag)) {
          flushLoose();
          var nested = Array.prototype.some.call(c.children, function (k) { return BLOCK.test(k.tagName.toLowerCase()); });
          if (nested) { walk(c); flushLoose(); return; }
          var t = inline(c).replace(/^\s+|\s+$/g, '').replace(/ {2}\n$/, '');
          if (t) blocks.push(blockStart(t));
        } else {
          loose.appendChild(c.cloneNode(true));
        }
      });
    }
    walk(root);
    flushLoose();
    return blocks.join('\n\n');
  }

  function plainText(md) {
    return md
      .replace(/\[([^\]]*)\]\(([^)]*)\)/g, function (_, t, h) { return /^https?:\/\//.test(t) ? t : t + ' ' + h; })
      .replace(/\*\*([\s\S]*?)\*\*/g, '$1')
      .replace(/\*([\s\S]*?)\*/g, '$1')
      .replace(/\\(.)/g, '$1')
      .replace(/ {2}\n/g, '\n');
  }

  // X counts every URL as 23 characters.
  function xLength(text) {
    return Array.from(text.replace(/https?:\/\/\S+/g, 'x'.repeat(23))).length;
  }

  function updateCount() {
    if (!crosspost.checked) { countEl.hidden = true; return; }
    var n = xLength(plainText(toMarkdown(editor)));
    countEl.hidden = false;
    countEl.textContent = n + ' / 280';
    countEl.classList.toggle('over', n > 280);
    countEl.title = n > 280 ? 'Too long for one post: X gets a shortened version with a link to the note.' : '';
  }
  crosspost.addEventListener('change', updateCount);

  // ---- settings ------------------------------------------------------------
  var settings = $('settings');
  function openSettings(msg) {
    var c = cfg();
    $('token').value = c.token;
    $('repo').value = c.repo;
    $('branch').value = c.branch;
    settings.hidden = false;
    setStatus($('settings-status'), msg || '', msg ? 'bad' : '');
  }
  $('settings-toggle').addEventListener('click', function () {
    $('notes').hidden = true;
    if (settings.hidden) openSettings(); else settings.hidden = true;
  });
  $('save-settings').addEventListener('click', function () {
    store.set(K.token, $('token').value.trim());
    store.set(K.repo, $('repo').value.trim() || DEFAULT_REPO);
    store.set(K.branch, $('branch').value.trim() || DEFAULT_BRANCH);
    var s = $('settings-status');
    setStatus(s, 'Checking…');
    gh('GET', '/repos/' + cfg().repo).then(function (r) {
      if (!r.permissions || !r.permissions.push) throw new Error('This token can read the repository but not write to it.');
      setStatus(s, 'Connected. You can post.', 'ok');
      setTimeout(function () { settings.hidden = true; }, 900);
    }).catch(function (e) { setStatus(s, e.message, 'bad'); });
  });
  $('forget-token').addEventListener('click', function () {
    store.del(K.token);
    $('token').value = '';
    setStatus($('settings-status'), 'Token removed from this device.', 'ok');
  });

  // ---- GitHub --------------------------------------------------------------
  function gh(method, path, body) {
    var c = cfg();
    return fetch('https://api.github.com' + path, {
      method: method,
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + c.token,
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json'
      },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.ok) return data;
        var err = new Error(
          res.status === 401 ? 'GitHub didn\'t accept the token. Check it in Settings.' :
          res.status === 403 ? 'The token isn\'t allowed to do that. It needs Contents: Read and write on this repository.' :
          res.status === 404 ? 'Not found on GitHub. Check the repository name and that the token can see it.' :
          (data.message || ('GitHub error ' + res.status)));
        err.status = res.status;
        throw err;
      });
    });
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function stamp(d) {
    var off = -d.getTimezoneOffset();
    var sign = off >= 0 ? '+' : '-';
    off = Math.abs(off);
    return {
      day: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
      hm: pad(d.getHours()) + pad(d.getMinutes()),
      sec: pad(d.getSeconds()),
      full: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
            pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' ' +
            sign + pad(Math.floor(off / 60)) + pad(off % 60)
    };
  }
  function b64(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin);
  }
  function exists(path) {
    var c = cfg();
    return gh('GET', '/repos/' + c.repo + '/contents/' + path + '?ref=' + encodeURIComponent(c.branch))
      .then(function () { return true; }, function (e) { if (e.status === 404) return false; throw e; });
  }

  function setStatus(el, html, kind) {
    el.innerHTML = html;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  publishBtn.addEventListener('click', function () {
    if (!canPublish()) return;
    var c = cfg();
    if (!c.token) return openSettings('Add your GitHub token first.');

    var md = toMarkdown(editor);
    if (editing) return saveEdit(md);
    var now = new Date();
    var t = stamp(now);
    var shots = photos.slice();

    publishBtn.disabled = true;
    setStatus(statusEl, 'Publishing…');

    var slug = t.hm;
    var path = '_posts/' + t.day + '-' + slug + '.markdown';
    exists(path).then(function (taken) {
      if (taken) { slug = t.hm + t.sec; path = '_posts/' + t.day + '-' + slug + '.markdown'; }
      var front = ['---', 'layout: note', 'date: ' + t.full];
      if (!crosspost.checked) front.push('crosspost: no');
      var files = [];
      if (shots.length) {
        front.push('images:');
        shots.forEach(function (p, i) {
          var base = 'uploads/notes/' + t.day.slice(0, 4) + '/' + t.day + '-' + slug + '-' + (i + 1);
          files.push({ path: base + '.jpg', blob: p.full }, { path: base + '-thumb.jpg', blob: p.thumb });
          front.push('  - src: /' + base + '.jpg', '    thumb: /' + base + '-thumb.jpg',
            '    width: ' + p.width, '    height: ' + p.height);
          if (p.alt) front.push('    alt: ' + JSON.stringify(p.alt));
        });
      }
      front.push('---', '', md, '');
      var content = front.join('\n');
      var firstLine = plainText(md).split('\n')[0] ||
        (shots.length === 1 ? 'a photo' : shots.length + ' photos');
      var msg = 'Note: ' + (firstLine.length > 60 ? firstLine.slice(0, 57) + '…' : firstLine);
      if (!files.length) {
        return gh('PUT', '/repos/' + c.repo + '/contents/' + path, {
          message: msg, content: b64(content), branch: c.branch
        });
      }
      files.push({ path: path, text: content });
      return commitFiles(files, msg);
    }).then(function (res) {
      // GitHub Pages builds in UTC, so the permalink's year/month come from the UTC date
      var url = SITE + '/' + now.getUTCFullYear() + '/' + pad(now.getUTCMonth() + 1) + '/' + slug + '/';
      var x = crosspost.checked ? ' It goes to X once the page is live.' : '';
      setStatus(statusEl,
        'Posted. <a href="' + url + '">Your note</a> will be live in a minute or two.' + x +
        (res.commit && res.commit.html_url ? ' <a href="' + res.commit.html_url + '">Commit</a>' : ''), 'ok');
      editor.innerHTML = '';
      crosspost.checked = true;
      store.del(K.draft);
      clearPhotos();
      onChange();
    }).catch(function (e) {
      setStatus(statusEl, escapeHtml(e.message) + ' Your text is still here.', 'bad');
      publishBtn.disabled = false;
      if (e.status === 401 || e.status === 403) openSettings(e.message);
    });
  });

  // ---- one commit with several files (photos + the note) -------------------
  // The contents API can only write one file per commit, and the X workflow
  // should see the note and its photos land together, so this goes through the
  // Git data API: blobs, a tree, a commit, then move the branch to it.
  function blobB64(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(',')[1]); };
      r.onerror = function () { rej(new Error('Could not read a photo.')); };
      r.readAsDataURL(blob);
    });
  }
  function commitFiles(files, message) {
    var c = cfg();
    var R = '/repos/' + c.repo + '/git/';
    var head;
    return gh('GET', R + 'ref/heads/' + encodeURIComponent(c.branch)).then(function (ref) {
      head = ref.object.sha;
      return gh('GET', R + 'commits/' + head);
    }).then(function (commit) {
      var done = 0;
      return Promise.all(files.map(function (f) {
        var data = f.blob ? blobB64(f.blob) : Promise.resolve(b64(f.text));
        return data.then(function (content) {
          return gh('POST', R + 'blobs', { content: content, encoding: 'base64' });
        }).then(function (b) {
          done++;
          setStatus(statusEl, 'Uploading… ' + done + ' of ' + files.length);
          return { path: f.path, mode: '100644', type: 'blob', sha: b.sha };
        });
      })).then(function (tree) {
        return gh('POST', R + 'trees', { base_tree: commit.tree.sha, tree: tree });
      });
    }).then(function (tree) {
      return gh('POST', R + 'commits', { message: message, tree: tree.sha, parents: [head] });
    }).then(function (commit) {
      return gh('PATCH', R + 'refs/heads/' + encodeURIComponent(c.branch), { sha: commit.sha }).then(function () {
        return { commit: { html_url: 'https://github.com/' + c.repo + '/commit/' + commit.sha } };
      });
    });
  }

  // ---- photos ------------------------------------------------------------------
  // Each photo is resized on the phone to a JPEG at most 2048px on its long
  // side, plus an 800px square thumbnail cut from its centre for the strip.
  var MAX_SIDE = 2048, THUMB = 800;
  var photos = []; // { full: Blob, thumb: Blob, width, height, alt, url }
  var photoList = $('photos');

  function decode(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(function () { return decodeImg(file); });
    }
    return decodeImg(file);
  }
  function decodeImg(file) {
    return new Promise(function (res, rej) {
      var img = new Image();
      var u = URL.createObjectURL(file);
      img.onload = function () { res(img); };
      img.onerror = function () { URL.revokeObjectURL(u); rej(new Error('That file doesn\'t look like a photo this browser can open.')); };
      img.src = u;
    });
  }
  function toJpeg(src, sx, sy, sw, sh, w, h, q) {
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); // transparent PNGs get a white ground
    g.imageSmoothingQuality = 'high';
    g.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
    return new Promise(function (res, rej) {
      cv.toBlob(function (b) { b ? res(b) : rej(new Error('Could not make a JPEG from that photo.')); }, 'image/jpeg', q);
    });
  }
  function addPhoto(file) {
    var p = { alt: '', url: URL.createObjectURL(file) };
    photos.push(p);
    renderPhotos();
    onChange();
    return decode(file).then(function (src) {
      var W = src.width || src.naturalWidth, H = src.height || src.naturalHeight;
      var k = Math.min(1, MAX_SIDE / Math.max(W, H));
      p.width = Math.round(W * k); p.height = Math.round(H * k);
      var side = Math.min(W, H), t = Math.min(THUMB, side);
      return Promise.all([
        toJpeg(src, 0, 0, W, H, p.width, p.height, 0.86),
        toJpeg(src, (W - side) / 2, (H - side) / 2, side, side, t, t, 0.82)
      ]);
    }).then(function (b) {
      p.full = b[0]; p.thumb = b[1];
      URL.revokeObjectURL(p.url);
      p.url = URL.createObjectURL(p.thumb);
      renderPhotos();
      onChange();
    }).catch(function (e) {
      photos.splice(photos.indexOf(p), 1);
      renderPhotos();
      onChange();
      setStatus(statusEl, escapeHtml(e.message), 'bad');
    });
  }
  function renderPhotos() {
    photoList.innerHTML = '';
    photos.forEach(function (p, i) {
      var li = document.createElement('li');
      if (!p.full) li.className = 'busy';
      var img = document.createElement('img');
      img.src = p.url; img.alt = p.alt;
      var rm = document.createElement('button');
      rm.type = 'button'; rm.className = 'remove'; rm.textContent = '\u00d7';
      rm.setAttribute('aria-label', 'Remove photo ' + (i + 1));
      rm.addEventListener('click', function () {
        photos.splice(photos.indexOf(p), 1);
        URL.revokeObjectURL(p.url);
        renderPhotos(); onChange();
      });
      var alt = document.createElement('button');
      alt.type = 'button'; alt.className = 'alt' + (p.alt ? ' set' : ''); alt.textContent = p.alt ? 'ALT \u2713' : 'ALT';
      alt.setAttribute('aria-label', 'Describe photo ' + (i + 1));
      alt.addEventListener('click', function () {
        var v = window.prompt('Describe this photo (alt text)', p.alt);
        if (v === null) return;
        p.alt = v.trim();
        renderPhotos();
      });
      li.appendChild(img); li.appendChild(rm); li.appendChild(alt);
      photoList.appendChild(li);
    });
  }
  function clearPhotos() {
    photos.forEach(function (p) { URL.revokeObjectURL(p.url); });
    photos = [];
    renderPhotos();
  }
  $('photo-input').addEventListener('change', function (e) {
    Array.prototype.forEach.call(e.target.files, addPhoto);
    e.target.value = '';
  });

  // ---- editing earlier notes ---------------------------------------------
  var NOTE_FILE = /^(\d{4})-(\d{2})-(\d{2})-(\d{4}(?:\d{2})?)\.(markdown|md)$/;
  var PAGE = 10;
  var allNotes = null;   // [{ name, path }] newest first
  var shown = 0;
  var cache = {};        // path -> { path, sha, front, body, date }

  function fromB64(str) {
    var bin = atob(str.replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function splitFront(text) {
    var m = text.match(/^(---\r?\n[\s\S]*?\r?\n---)\r?\n?([\s\S]*)$/);
    if (!m) return null;
    var date = (m[1].match(/^date:\s*(.+)$/m) || [])[1];
    return { front: m[1], body: m[2].replace(/^\s+|\s+$/g, ''), isNote: /^layout:\s*["']?note["']?\s*$/m.test(m[1]), date: date };
  }
  function parseDate(str) {
    if (!str) return null;
    var d = new Date(str.trim().replace(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}(?::\d{2})?) ?([+-]\d{2})(\d{2})$/, '$1T$2$3:$4'));
    return isNaN(d) ? null : d;
  }
  // Same rule as Jekyll here: /:year/:month/:title/, year and month from the date in UTC
  function noteUrl(name, date) {
    var m = name.match(NOTE_FILE);
    var y = m[1], mo = m[2];
    if (date) { y = String(date.getUTCFullYear()); mo = pad(date.getUTCMonth() + 1); }
    return SITE + '/' + y + '/' + mo + '/' + m[4] + '/';
  }
  function whenLabel(name, date) {
    if (!date) { var m = name.match(NOTE_FILE); date = new Date(+m[1], +m[2] - 1, +m[3], +m[4].slice(0, 2), +m[4].slice(2, 4)); }
    return date.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' +
           date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function loadNote(entry) {
    if (cache[entry.path]) return Promise.resolve(cache[entry.path]);
    var c = cfg();
    return gh('GET', '/repos/' + c.repo + '/contents/' + entry.path + '?ref=' + encodeURIComponent(c.branch)).then(function (f) {
      var parts = splitFront(fromB64(f.content || ''));
      if (!parts || !parts.isNote) return null;
      var date = parseDate(parts.date);
      return (cache[entry.path] = {
        name: entry.name, path: entry.path, sha: f.sha, front: parts.front, body: parts.body,
        label: whenLabel(entry.name, date), url: noteUrl(entry.name, date)
      });
    });
  }

  function showMore() {
    var list = $('note-list');
    var batch = allNotes.slice(shown, shown + PAGE);
    shown += batch.length;
    $('more').hidden = true;
    setStatus($('notes-status'), 'Loading…');
    return Promise.all(batch.map(loadNote)).then(function (notes) {
      notes.forEach(function (n) {
        if (!n) return;
        var li = document.createElement('li');
        var b = document.createElement('button');
        b.type = 'button';
        var when = document.createElement('span'); when.className = 'when'; when.textContent = n.label;
        var snip = document.createElement('span'); snip.className = 'snip';
        var t = plainText(n.body).replace(/\s+/g, ' ');
        var pics = (n.front.match(/^\s+- src:/gm) || []).length;
        if (pics) t = (pics === 1 ? '[photo] ' : '[' + pics + ' photos] ') + t;
        snip.textContent = t.length > 140 ? t.slice(0, 137) + '…' : t;
        b.appendChild(when); b.appendChild(snip);
        b.addEventListener('click', function () { startEdit(n); });
        li.appendChild(b);
        list.appendChild(li);
      });
      setStatus($('notes-status'), list.children.length ? '' : 'No notes yet.');
      $('more').hidden = shown >= allNotes.length;
    }).catch(function (e) {
      shown -= batch.length;
      $('more').hidden = false;
      setStatus($('notes-status'), escapeHtml(e.message), 'bad');
    });
  }

  function openNotes() {
    if (!cfg().token) return openSettings('Add your GitHub token first.');
    settings.hidden = true;
    $('notes').hidden = false;
    $('note-list').innerHTML = '';
    shown = 0;
    setStatus($('notes-status'), 'Loading…');
    var c = cfg();
    gh('GET', '/repos/' + c.repo + '/contents/_posts?ref=' + encodeURIComponent(c.branch)).then(function (files) {
      allNotes = files
        .filter(function (f) { return f.type === 'file' && NOTE_FILE.test(f.name); })
        .sort(function (a, b) { return a.name < b.name ? 1 : -1; })
        .map(function (f) { return { name: f.name, path: f.path }; });
      return showMore();
    }).catch(function (e) {
      setStatus($('notes-status'), escapeHtml(e.message), 'bad');
      if (e.status === 401 || e.status === 403) openSettings(e.message);
    });
  }
  $('notes-toggle').addEventListener('click', function () {
    if ($('notes').hidden) openNotes(); else $('notes').hidden = true;
  });
  $('more').addEventListener('click', showMore);

  function setMode(note) {
    editing = note;
    $('title').textContent = note ? 'Edit note' : 'New note';
    $('editbar').hidden = !note;
    // Editing: "Update on X" replaces the note's X posts with the new text.
    $('crosspost-label').textContent = note ? 'Update on X' : 'Post to X';
    crosspost.checked = true;
    updateCount();
    publishBtn.textContent = note ? 'Save changes' : 'Publish';
    // Editing keeps a note's photos as they are; adding or removing them is for new notes.
    $('add-photos').hidden = !!note;
    photoList.hidden = !!note;
    if (note) $('editing-label').innerHTML = 'Editing <a href="' + escapeAttr(note.url) + '">' + escapeHtml(note.label) + '</a>';
  }
  function startEdit(note) {
    $('notes').hidden = true;
    setMode(note);
    editor.innerHTML = markdownToHtml(note.body);
    setStatus(statusEl, '');
    onChange();
    window.scrollTo(0, 0);
  }
  function stopEdit() {
    setMode(null);
    editor.innerHTML = store.get(K.draft, '');
    onChange();
  }
  $('cancel-edit').addEventListener('click', function () { stopEdit(); setStatus(statusEl, ''); });

  function saveEdit(md) {
    var c = cfg();
    var note = editing;
    publishBtn.disabled = true;
    setStatus(statusEl, 'Saving…');
    var firstLine = plainText(md).split('\n')[0];
    var toX = crosspost.checked;
    gh('PUT', '/repos/' + c.repo + '/contents/' + note.path, {
      message: 'Edit note: ' + (firstLine.length > 55 ? firstLine.slice(0, 52) + '…' : firstLine) + (toX ? ' [x]' : ''),
      content: b64(note.front + '\n\n' + md + '\n'),
      sha: note.sha,
      branch: c.branch
    }).then(function (res) {
      note.sha = res.content && res.content.sha;
      note.body = md;
      stopEdit();
      setStatus(statusEl, 'Saved. <a href="' + escapeAttr(note.url) + '">The note</a> updates in a minute or two.' +
        (toX ? ' X gets the new version once it\'s live.' : ''), 'ok');
    }).catch(function (e) {
      var msg = e.status === 409 ? 'This note changed somewhere else since you opened it. Cancel and open it again.' : e.message;
      setStatus(statusEl, escapeHtml(msg) + ' Your text is still here.', 'bad');
      publishBtn.disabled = false;
      if (e.status === 401 || e.status === 403) openSettings(e.message);
    });
  }

  // ---- Markdown -> HTML (for loading a note into the editor) ---------------
  // The reverse of toMarkdown: paragraphs, line breaks, bold, italic, links, lists.
  function mdInline(text) {
    var held = [];
    var s = text.replace(/\\([\\`*_{}\[\]()<>#+\-.!=|~])/g, function (_, ch) { held.push(ch); return '\u0000' + (held.length - 1) + '\u0001'; });
    s = escapeHtml(s);
    s = s.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, t, href) {
      var real = href.replace(/\u0000(\d+)\u0001/g, function (_, i) { return held[i]; });
      return '<a href="' + escapeAttr(real.replace(/&amp;/g, '&')) + '">' + t + '</a>';
    });
    s = s.replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g, '<a href="$1">$1</a>');
    s = s.replace(/\*\*([^*]+?)\*\*|__([^_]+?)__/g, function (_, a, b) { return '<b>' + (a || b) + '</b>'; });
    s = s.replace(/\*([^*]+?)\*|(^|[^\w])_([^_]+?)_(?!\w)/g, function (_, a, pre, b) { return a != null ? '<i>' + a + '</i>' : pre + '<i>' + b + '</i>'; });
    return s.replace(/\u0000(\d+)\u0001/g, function (_, i) { return escapeHtml(held[i]); });
  }
  function markdownToHtml(md) {
    var blocks = md.replace(/\r\n?/g, '\n').replace(/^\s+|\s+$/g, '').split(/\n\s*\n/);
    return blocks.map(function (block) {
      var lines = block.split('\n');
      var ul = lines.every(function (l) { return /^\s*[-*+]\s+/.test(l); });
      var ol = lines.every(function (l) { return /^\s*\d+\.\s+/.test(l); });
      if (ul || ol) {
        var tag = ul ? 'ul' : 'ol';
        return '<' + tag + '>' + lines.map(function (l) {
          return '<li>' + mdInline(l.replace(/^\s*([-*+]|\d+\.)\s+/, '')) + '</li>';
        }).join('') + '</' + tag + '>';
      }
      var html = '';
      lines.forEach(function (l, i) {
        var br = / {2,}$/.test(l) || /\\$/.test(l);
        html += mdInline(l.replace(/ {2,}$/, '').replace(/\\$/, ''));
        if (i < lines.length - 1) html += br ? '<br>' : ' ';
      });
      return '<p>' + html + '</p>';
    }).join('');
  }

  // expose for tests
  window.__note = {
    toMarkdown: function () { return toMarkdown(editor); }, plainText: plainText, xLength: xLength,
    roundTrip: function (md) { var d = document.createElement('div'); d.innerHTML = markdownToHtml(md); return toMarkdown(d); }
  };

  onChange();
  if (!cfg().token) openSettings();
})();
</script>
</body>
</html>
